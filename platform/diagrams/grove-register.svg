<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540"
     font-family="Arial, 'Helvetica Neue', sans-serif">
  <defs>
    <style>
      .actor-label { fill: #F0EEED; font-size: 16px; font-weight: 600; }
      .sub-label   { fill: #A1A7AE; font-size: 11px; }
      .step-label  { fill: #F0EEED; font-size: 14px; }
      .step-sub    { fill: #A1A7AE; font-size: 12px; font-style: italic; }
      .num-badge   { fill: #FFFFFF; font-size: 12px; font-weight: 700; }
      .lifeline    { stroke: #FFFFFF; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.4; }
      .state-tag   { fill: #A1A7AE; font-size: 12px; font-style: italic; }
      .legend-title { fill: #B0A7FF; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; }
      .legend-text  { fill: #A1A7AE; font-size: 13px; }
      .box         { fill: #000000; }

      /* Fragments — hidden by default, revealed by host script adding .shown */
      [data-fragment] { opacity: 0; transition: opacity 0.25s ease; }
      [data-fragment].shown { opacity: 1; }
    </style>
    <marker id="seqArrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#3366FF"/>
    </marker>
  </defs>

  <!-- Lane headers -->
  <g transform="translate(20, 20)">
    <rect width="160" height="50" rx="8" class="box" stroke="#FFFFFF" stroke-width="2"/>
    <text x="80" y="22" class="actor-label" text-anchor="middle">Developer</text>
    <text x="80" y="40" class="sub-label"  text-anchor="middle">local repo + CLI</text>
  </g>
  <g transform="translate(200, 20)">
    <rect width="160" height="50" rx="8" class="box" stroke="#FFFFFF" stroke-width="2"/>
    <text x="80" y="22" class="actor-label" text-anchor="middle">grove CLI</text>
    <text x="80" y="40" class="sub-label"  text-anchor="middle">local binary</text>
  </g>
  <g transform="translate(380, 20)">
    <rect width="160" height="50" rx="8" class="box" stroke="#FFFFFF" stroke-width="2"/>
    <text x="80" y="22" class="actor-label" text-anchor="middle">Forgejo</text>
    <text x="80" y="40" class="sub-label"  text-anchor="middle">git + Actions</text>
  </g>
  <g transform="translate(560, 20)">
    <rect width="160" height="50" rx="8" class="box" stroke="#FFFFFF" stroke-width="2"/>
    <text x="80" y="22" class="actor-label" text-anchor="middle">Operator</text>
    <text x="80" y="40" class="sub-label"  text-anchor="middle">reconciles App CR</text>
  </g>
  <g transform="translate(740, 20)">
    <rect width="160" height="50" rx="8" class="box" stroke="#FFFFFF" stroke-width="2"/>
    <text x="80" y="22" class="actor-label" text-anchor="middle">ArgoCD</text>
    <text x="80" y="40" class="sub-label"  text-anchor="middle">syncs from git</text>
  </g>
  <g transform="translate(920, 20)">
    <rect width="160" height="50" rx="8" class="box" stroke="#FFFFFF" stroke-width="2"/>
    <text x="80" y="22" class="actor-label" text-anchor="middle">Cluster</text>
    <text x="80" y="40" class="sub-label"  text-anchor="middle">pods + ingress</text>
  </g>

  <!-- Lifelines -->
  <line x1="100" y1="70"  x2="100"  y2="475" class="lifeline"/>
  <line x1="280" y1="70"  x2="280"  y2="475" class="lifeline"/>
  <line x1="460" y1="70"  x2="460"  y2="475" class="lifeline"/>
  <line x1="640" y1="70"  x2="640"  y2="475" class="lifeline"/>
  <line x1="820" y1="70"  x2="820"  y2="475" class="lifeline"/>
  <line x1="1000" y1="70" x2="1000" y2="475" class="lifeline"/>

  <!-- Fragment 1: Step 1 — Dev self-action: grove init -->
  <g data-fragment="1">
    <path d="M 100 100 h 30 v 20 h -30" stroke="#3366FF" stroke-width="2" fill="none" marker-end="url(#seqArrow)"/>
    <circle cx="100" cy="100" r="10" fill="#3366FF"/>
    <text x="100" y="104" class="num-badge" text-anchor="middle">1</text>
    <text x="145" y="115" class="step-label">grove init</text>
    <text x="145" y="131" class="step-sub">templates a new local repo</text>
  </g>

  <!-- Fragment 2: Step 2 — Dev → grove CLI: grove register -->
  <g data-fragment="2">
    <path d="M 100 160 L 275 160" stroke="#3366FF" stroke-width="2" fill="none" marker-end="url(#seqArrow)"/>
    <circle cx="110" cy="160" r="10" fill="#3366FF"/>
    <text x="110" y="164" class="num-badge" text-anchor="middle">2</text>
    <text x="188" y="150" class="step-label" text-anchor="middle">grove register</text>
  </g>

  <!-- Fragment 3: Developer / Platform divider -->
  <g data-fragment="3">
    <line x1="20" y1="185" x2="1080" y2="185" stroke="#F7675E" stroke-width="1.5" stroke-dasharray="10 5"/>
    <rect x="420" y="172" width="260" height="26" rx="4" fill="#000000"/>
    <text x="550" y="191" text-anchor="middle" fill="#F7675E" font-size="13px" font-weight="600" letter-spacing="0.05em">▲ DEVELOPER  ·  PLATFORM ▼</text>
  </g>

  <!-- Fragment 4: Step 3 — grove → Forgejo -->
  <g data-fragment="4">
    <path d="M 280 220 L 455 220" stroke="#3366FF" stroke-width="2" fill="none" marker-end="url(#seqArrow)"/>
    <circle cx="290" cy="220" r="10" fill="#3366FF"/>
    <text x="290" y="224" class="num-badge" text-anchor="middle">3</text>
    <text x="370" y="210" class="step-label" text-anchor="middle">create repo + push</text>
  </g>

  <!-- Fragment 5: Step 4 — grove → Operator -->
  <g data-fragment="5">
    <path d="M 280 265 L 635 265" stroke="#3366FF" stroke-width="2" fill="none" marker-end="url(#seqArrow)"/>
    <circle cx="290" cy="265" r="10" fill="#3366FF"/>
    <text x="290" y="269" class="num-badge" text-anchor="middle">4</text>
    <text x="460" y="255" class="step-label" text-anchor="middle">kubectl apply App CR</text>
    <text x="460" y="281" class="step-sub"   text-anchor="middle">declares desired app to platform</text>
  </g>

  <!-- Fragment 6: Step 5 — Operator → ArgoCD -->
  <g data-fragment="6">
    <path d="M 640 310 L 815 310" stroke="#3366FF" stroke-width="2" fill="none" marker-end="url(#seqArrow)"/>
    <circle cx="650" cy="310" r="10" fill="#3366FF"/>
    <text x="650" y="314" class="num-badge" text-anchor="middle">5</text>
    <text x="730" y="300" class="step-label" text-anchor="middle">create Argo Application</text>
  </g>

  <!-- Fragment 7: Step 6 — Forgejo self-action: Actions build + push image -->
  <g data-fragment="7">
    <path d="M 460 350 h 30 v 20 h -30" stroke="#3366FF" stroke-width="2" fill="none" marker-end="url(#seqArrow)"/>
    <circle cx="460" cy="350" r="10" fill="#3366FF"/>
    <text x="460" y="354" class="num-badge" text-anchor="middle">6</text>
    <text x="505" y="365" class="step-label">Forgejo Actions</text>
    <text x="505" y="381" class="step-sub">docker build + push image</text>
  </g>

  <!-- Fragment 8: Step 7 — ArgoCD → Forgejo (read manifests) -->
  <g data-fragment="8">
    <path d="M 820 410 L 465 410" stroke="#3366FF" stroke-width="2" fill="none" marker-end="url(#seqArrow)"/>
    <circle cx="810" cy="410" r="10" fill="#3366FF"/>
    <text x="810" y="414" class="num-badge" text-anchor="middle">7</text>
    <text x="640" y="400" class="step-label" text-anchor="middle">read manifests (git is source of truth)</text>
  </g>

  <!-- Fragment 9: Step 8 — ArgoCD → Cluster -->
  <g data-fragment="9">
    <path d="M 820 450 L 995 450" stroke="#3366FF" stroke-width="2" fill="none" marker-end="url(#seqArrow)"/>
    <circle cx="830" cy="450" r="10" fill="#3366FF"/>
    <text x="830" y="454" class="num-badge" text-anchor="middle">8</text>
    <text x="910" y="440" class="step-label" text-anchor="middle">deploy</text>
    <text x="910" y="466" class="step-sub"   text-anchor="middle">applies manifests + pulls image</text>
  </g>

  <!-- Fragment 10: Step 9 — Cluster → Developer (long return) -->
  <g data-fragment="10">
    <path d="M 1000 500 L 105 500" stroke="#3366FF" stroke-width="2" fill="none" marker-end="url(#seqArrow)"/>
    <circle cx="990" cy="500" r="10" fill="#3366FF"/>
    <text x="990" y="504" class="num-badge" text-anchor="middle">9</text>
    <text x="545" y="490" class="step-label" text-anchor="middle">app URL — hello world is live</text>
  </g>

  <!-- Context legend (always visible) -->
  <g transform="translate(30, 530)">
    <text x="0" y="0" class="legend-text"><tspan class="legend-title">CONTEXT</tspan>   <tspan fill="#F0EEED" font-weight="600">Actors</tspan> columns   ·   <tspan fill="#F0EEED" font-weight="600">State</tspan> git = source of truth · App CR = desired state   ·   <tspan fill="#F0EEED" font-weight="600">Surfaces</tspan> two CLI commands → the rest is declarative + automated</text>
  </g>
</svg>
