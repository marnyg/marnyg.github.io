<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420"
     font-family="Arial, 'Helvetica Neue', sans-serif">
  <defs>
    <style>
      .actor-label  { fill: #F0EEED; font-size: 17px; font-weight: 600; }
      .sub-label    { fill: #A1A7AE; font-size: 12px; }
      .arrow-label  { fill: #F0EEED; font-size: 13px; }
      .gate-label   { fill: #F7675E; font-size: 13px; font-weight: 600; }
      .arrow-sub    { fill: #A1A7AE; font-size: 11px; font-style: italic; }
      .state-title  { fill: #B0A7FF; font-size: 11px; font-weight: 600; }
      .note         { fill: #A1A7AE; font-size: 14px; font-style: italic; }
      .legend-title { fill: #B0A7FF; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; }
      .legend-text  { fill: #A1A7AE; font-size: 13px; }
      .box          { fill: #000000; }

      /* Fragments — hidden by default, revealed by host script adding .shown */
      [data-fragment] { opacity: 0; transition: opacity 0.25s ease; }
      [data-fragment].shown { opacity: 1; }
    </style>
    <marker id="flowArrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#3366FF"/>
    </marker>
    <marker id="gateArrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#F7675E"/>
    </marker>
  </defs>

  <!-- Title (always visible) -->
  <text x="550" y="70"  class="note" text-anchor="middle" fill="#F0EEED" font-size="16" font-weight="600">Merge — Kargo promotes through the gate to prod</text>
  <text x="550" y="92"  class="note" text-anchor="middle">Picks up where the PR preview left off: merge, then approve the gate</text>

  <!-- Developer / automatic divider (always visible) -->
  <line x1="210" y1="30" x2="210" y2="380" stroke="#F7675E" stroke-width="1.5" stroke-dasharray="10 5"/>
  <rect x="155" y="35" width="110" height="24" rx="4" fill="#000000"/>
  <text x="210" y="52" text-anchor="middle" fill="#F7675E" font-size="12px" font-weight="600" letter-spacing="0.05em">◀ DEV · AUTO ▶</text>

  <!-- Fragment 1: Developer clicks merge -> Forgejo Actions builds image -->
  <g data-fragment="1">
    <g transform="translate(30, 140)">
      <rect width="160" height="80" rx="8" class="box" stroke="#FFFFFF" stroke-width="2"/>
      <text x="80" y="32" class="actor-label" text-anchor="middle">Developer</text>
      <text x="80" y="52" class="sub-label"  text-anchor="middle">clicks merge on the PR</text>
      <text x="80" y="70" class="sub-label"  text-anchor="middle">surface: Forgejo UI</text>
    </g>
    <g transform="translate(230, 140)">
      <rect width="160" height="80" rx="8" class="box" stroke="#FFFFFF" stroke-width="2"/>
      <text x="80" y="32" class="actor-label" text-anchor="middle">Forgejo Actions</text>
      <text x="80" y="52" class="sub-label"  text-anchor="middle">docker build + push</text>
      <text x="80" y="70" class="state-title" text-anchor="middle">STATE: image (Freight)</text>
    </g>
    <path d="M 190 180 L 225 180" stroke="#3366FF" stroke-width="2" fill="none" marker-end="url(#flowArrow)"/>
    <text x="207" y="125" class="arrow-label" text-anchor="middle">merge</text>
  </g>

  <!-- Fragment 2: Kargo auto-promotes to tst, ArgoCD syncs -->
  <g data-fragment="2">
    <g transform="translate(430, 140)">
      <rect width="160" height="80" rx="8" class="box" stroke="#FFFFFF" stroke-width="2"/>
      <text x="80" y="30" class="actor-label" text-anchor="middle">Kargo · tst</text>
      <text x="80" y="50" class="sub-label"  text-anchor="middle">auto-promote, ArgoCD syncs</text>
      <text x="80" y="68" class="state-title" text-anchor="middle">STATE: live in tst</text>
    </g>
    <path d="M 390 180 L 425 180" stroke="#3366FF" stroke-width="2" fill="none" marker-end="url(#flowArrow)"/>
    <text x="407" y="125" class="arrow-label" text-anchor="middle">new Freight</text>
  </g>

  <!-- Fragment 3: Gate — manual approval -->
  <g data-fragment="3">
    <g transform="translate(630, 140)">
      <rect width="160" height="80" rx="8" class="box" stroke="#F7675E" stroke-width="2"/>
      <text x="80" y="30" class="actor-label" text-anchor="middle">Gate</text>
      <text x="80" y="50" class="gate-label"  text-anchor="middle">manual approval required</text>
      <text x="80" y="68" class="state-title" text-anchor="middle">STATE: awaiting approval</text>
    </g>
    <path d="M 590 180 L 625 180" stroke="#3366FF" stroke-width="2" fill="none" marker-end="url(#flowArrow)"/>
    <text x="607" y="125" class="arrow-label" text-anchor="middle">promoted to tst</text>
  </g>

  <!-- Fragment 4: Kargo promotes to prd, ArgoCD syncs -> live -->
  <g data-fragment="4">
    <g transform="translate(830, 140)">
      <rect width="180" height="80" rx="8" class="box" stroke="#FFFFFF" stroke-width="2"/>
      <text x="90" y="30" class="actor-label" text-anchor="middle">Kargo · prd</text>
      <text x="90" y="50" class="sub-label"  text-anchor="middle">promote, ArgoCD syncs → live</text>
      <text x="90" y="68" class="state-title" text-anchor="middle">STATE: live in prd</text>
    </g>
    <path d="M 790 180 L 825 180" stroke="#F7675E" stroke-width="2" fill="none" marker-end="url(#gateArrow)"/>
    <text x="808" y="125" class="gate-label" text-anchor="middle">approve → prd</text>
  </g>

  <!-- Fragment 5: Turnaround note -->
  <g data-fragment="5">
    <text x="550" y="300" class="note" text-anchor="middle">Kargo writes each promotion as a Git commit · ArgoCD reconciles · nothing skips the gate</text>
  </g>

  <!-- Context legend (always visible) -->
  <g transform="translate(30, 400)">
    <text x="0" y="0" class="legend-text"><tspan class="legend-title">CONTEXT</tspan>   <tspan fill="#F0EEED" font-weight="600">Actors</tspan> dev + Forgejo + Kargo + ArgoCD   ·   <tspan fill="#F0EEED" font-weight="600">State</tspan> image → tst → prd, all in Git   ·   <tspan fill="#F0EEED" font-weight="600">Surface</tspan> two clicks: merge + approve gate</text>
  </g>
</svg>
