<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 620" role="img"
     aria-label="Kargo, ArgoCD and Image Updater release-branch flow"
     font-family="Arial, 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A7AE"/>
    </marker>
    <marker id="arrow-iu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F7675E"/>
    </marker>
    <marker id="arrow-kargo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/>
    </marker>
    <marker id="arrow-promote" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="13" fill="#A1A7AE">git repository (one per Application)</text>

  <!-- ===== STAGE BOXES (Kargo Stage + ArgoCD App) ===== -->
  <!-- prd (oldest) on left, stg in middle, tst at HEAD -->
  <g>
    <rect x="180" y="60" width="140" height="80" rx="6" fill="#1A1B1C" stroke="#E8A33D" stroke-width="2"/>
    <text x="250" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#E8A33D">Kargo Stage</text>
    <text x="250" y="96" text-anchor="middle" font-size="11" fill="#F0EEED">+ ArgoCD Application</text>
    <text x="250" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">prd</text>
    <text x="250" y="134" text-anchor="middle" font-size="10" fill="#A1A7AE">manual promote</text>
  </g>
  <g>
    <rect x="460" y="60" width="140" height="80" rx="6" fill="#1A1B1C" stroke="#E8A33D" stroke-width="2"/>
    <text x="530" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#E8A33D">Kargo Stage</text>
    <text x="530" y="96" text-anchor="middle" font-size="11" fill="#F0EEED">+ ArgoCD Application</text>
    <text x="530" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">stg</text>
    <text x="530" y="134" text-anchor="middle" font-size="10" fill="#A1A7AE">manual promote</text>
  </g>
  <g>
    <rect x="810" y="60" width="140" height="80" rx="6" fill="#1A1B1C" stroke="#E8A33D" stroke-width="2"/>
    <text x="880" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#E8A33D">Kargo Stage</text>
    <text x="880" y="96" text-anchor="middle" font-size="11" fill="#F0EEED">+ ArgoCD Application</text>
    <text x="880" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">tst</text>
    <text x="880" y="134" text-anchor="middle" font-size="10" fill="#A1A7AE">auto promote (Warehouse)</text>
  </g>

  <!-- Promotion arrows tst -> stg -> prd -->
  <line x1="810" y1="100" x2="605" y2="100" stroke="#E8A33D" stroke-width="2" marker-end="url(#arrow-promote)"/>
  <text x="707" y="92" text-anchor="middle" font-size="10" fill="#E8A33D">promote (manual)</text>
  <line x1="460" y1="100" x2="325" y2="100" stroke="#E8A33D" stroke-width="2" marker-end="url(#arrow-promote)"/>
  <text x="392" y="92" text-anchor="middle" font-size="10" fill="#E8A33D">promote (manual)</text>

  <!-- Pin-SHA arrows down to commits -->
  <line x1="250" y1="140" x2="250" y2="252" stroke="#E8A33D" stroke-width="2" marker-end="url(#arrow-kargo)"/>
  <text x="258" y="180" font-size="10" fill="#E8A33D">pin SHA</text>
  <line x1="530" y1="140" x2="530" y2="252" stroke="#E8A33D" stroke-width="2" marker-end="url(#arrow-kargo)"/>
  <text x="538" y="180" font-size="10" fill="#E8A33D">pin SHA</text>
  <line x1="880" y1="140" x2="880" y2="252" stroke="#E8A33D" stroke-width="2" marker-end="url(#arrow-kargo)"/>
  <text x="888" y="180" font-size="10" fill="#E8A33D">pin SHA</text>

  <!-- ===== RELEASE BRANCH ===== -->
  <text x="60" y="248" font-size="12" fill="#3366FF" font-weight="600">release branch (e.g. main)</text>
  <line x1="60" y1="260" x2="930" y2="260" stroke="#3366FF" stroke-width="3"/>

  <g fill="#1A1B1C" stroke="#3366FF" stroke-width="2">
    <circle cx="110" cy="260" r="7"/>
    <circle cx="180" cy="260" r="7"/>
    <circle cx="320" cy="260" r="7"/>
    <circle cx="390" cy="260" r="7"/>
    <circle cx="460" cy="260" r="7"/>
    <circle cx="600" cy="260" r="7"/>
    <circle cx="670" cy="260" r="7"/>
    <circle cx="740" cy="260" r="7"/>
    <circle cx="810" cy="260" r="7"/>
  </g>

  <!-- Pinned commits -->
  <circle cx="250" cy="260" r="10" fill="#E8A33D" stroke="#FFC773" stroke-width="2"/>
  <text x="250" y="288" text-anchor="middle" font-size="10" fill="#FFC773">prd pin</text>
  <circle cx="530" cy="260" r="10" fill="#E8A33D" stroke="#FFC773" stroke-width="2"/>
  <text x="530" y="288" text-anchor="middle" font-size="10" fill="#FFC773">stg pin</text>
  <circle cx="880" cy="260" r="10" fill="#E8A33D" stroke="#FFC773" stroke-width="2"/>
  <text x="880" y="288" text-anchor="middle" font-size="10" fill="#FFC773">tst pin = HEAD</text>

  <!-- ===== IMAGE UPDATER -> release branch ===== -->
  <rect x="980" y="230" width="140" height="60" rx="6" fill="#1A1B1C" stroke="#F7675E" stroke-width="2"/>
  <text x="1050" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#F7675E">Image Updater</text>
  <text x="1050" y="268" text-anchor="middle" font-size="10" fill="#A1A7AE">cluster singleton</text>
  <text x="1050" y="282" text-anchor="middle" font-size="10" fill="#A1A7AE">writes image-tag commits</text>
  <line x1="975" y1="260" x2="895" y2="260" stroke="#F7675E" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-iu)"/>

  <!-- ===== FEATURE / DEV BRANCH ===== -->
  <g>
    <line x1="390" y1="267" x2="390" y2="380" stroke="#A1A7AE" stroke-width="2.5"/>
    <line x1="390" y1="380" x2="780" y2="380" stroke="#A1A7AE" stroke-width="2.5"/>
    <g fill="#1A1B1C" stroke="#A1A7AE" stroke-width="2">
      <circle cx="430" cy="380" r="6"/>
      <circle cx="510" cy="380" r="6"/>
      <circle cx="590" cy="380" r="6"/>
      <circle cx="670" cy="380" r="6"/>
      <circle cx="750" cy="380" r="6"/>
    </g>
    <text x="390" y="365" font-size="12" fill="#A1A7AE" font-weight="600">feature / dev branch</text>
    <text x="790" y="384" font-size="11" fill="#A1A7AE" font-style="italic">no ArgoCD App &#8594; no Image Updater</text>
  </g>

  <!-- ===== PR BRANCH 1 ===== -->
  <g>
    <line x1="600" y1="267" x2="600" y2="480" stroke="#B0A7FF" stroke-width="2.5"/>
    <line x1="600" y1="480" x2="930" y2="480" stroke="#B0A7FF" stroke-width="2.5"/>
    <g fill="#1A1B1C" stroke="#B0A7FF" stroke-width="2">
      <circle cx="640" cy="480" r="6"/>
      <circle cx="710" cy="480" r="6"/>
      <circle cx="780" cy="480" r="6"/>
      <circle cx="850" cy="480" r="6"/>
      <circle cx="910" cy="480" r="6"/>
    </g>
    <text x="600" y="465" font-size="12" fill="#B0A7FF" font-weight="600">PR branch &#8212; preview env (ArgoCD App per PR)</text>
    <rect x="980" y="455" width="140" height="50" rx="6" fill="#1A1B1C" stroke="#F7675E" stroke-width="2"/>
    <text x="1050" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#F7675E">Image Updater</text>
    <text x="1050" y="491" text-anchor="middle" font-size="10" fill="#A1A7AE">writes to PR branch</text>
    <line x1="975" y1="480" x2="935" y2="480" stroke="#F7675E" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-iu)"/>
  </g>

  <!-- ===== PR BRANCH 2 ===== -->
  <g>
    <line x1="670" y1="267" x2="670" y2="580" stroke="#B0A7FF" stroke-width="2.5"/>
    <line x1="670" y1="580" x2="930" y2="580" stroke="#B0A7FF" stroke-width="2.5"/>
    <g fill="#1A1B1C" stroke="#B0A7FF" stroke-width="2">
      <circle cx="710" cy="580" r="6"/>
      <circle cx="780" cy="580" r="6"/>
      <circle cx="850" cy="580" r="6"/>
      <circle cx="910" cy="580" r="6"/>
    </g>
    <text x="670" y="565" font-size="12" fill="#B0A7FF" font-weight="600">PR branch &#8212; preview env (ArgoCD App per PR)</text>
    <rect x="980" y="555" width="140" height="50" rx="6" fill="#1A1B1C" stroke="#F7675E" stroke-width="2"/>
    <text x="1050" y="575" text-anchor="middle" font-size="12" font-weight="700" fill="#F7675E">Image Updater</text>
    <text x="1050" y="591" text-anchor="middle" font-size="10" fill="#A1A7AE">writes to PR branch</text>
    <line x1="975" y1="580" x2="935" y2="580" stroke="#F7675E" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-iu)"/>
  </g>

  <!-- Sprout dots on top -->
  <circle cx="390" cy="260" r="7" fill="#1A1B1C" stroke="#A1A7AE" stroke-width="2"/>
  <circle cx="600" cy="260" r="7" fill="#1A1B1C" stroke="#B0A7FF" stroke-width="2"/>
  <circle cx="670" cy="260" r="7" fill="#1A1B1C" stroke="#B0A7FF" stroke-width="2"/>
</svg>
